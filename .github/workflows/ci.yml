name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore MjmlProcessor.slnx

      - name: Build
        run: dotnet build MjmlProcessor.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MjmlProcessor.slnx --configuration Release --no-build --verbosity normal
